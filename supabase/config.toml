# Supabase Configuration File
# This file contains the configuration for your Supabase project
# Copy this file to your Supabase project root if you're using local development

[project]
name = "Tranzo - Personal Finance Tracker"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Email/OTP authentication is enabled by default
# Additional providers can be configured in the Supabase dashboard

[auth.email]
enable_signup = true
enable_confirmations = false
# OTP-based authentication (passwordless)
enable_magic_link = true

[storage]
enabled = true
file_size_limit = "50MB"

[edge_functions]
enabled = false
